name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smart_school_scheduling_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, mysqli, gd, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.lock for matrix PHP
        run: composer validate --no-check-publish --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer audit
        run: composer audit --no-dev || true

      - name: PHPUnit
        env:
          database.tests.hostname: 127.0.0.1
          database.tests.database: smart_school_scheduling_test
          database.tests.username: root
          database.tests.password: root
          database.tests.DBDriver: MySQLi
          database.tests.port: 3306
        run: vendor/bin/phpunit --configuration phpunit.dist.xml
