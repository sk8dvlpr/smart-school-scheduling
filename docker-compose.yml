services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      CI_ENVIRONMENT: development
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_school_scheduling
    ports:
      - "3306:3306"
    volumes:
      - s3_mysql_data:/var/lib/mysql

volumes:
  s3_mysql_data:
